<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRƯỜNG THPT VỊ THANH - Tra Cứu Điểm Danh Học Sinh</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .badge-on-time { background-color: #dcfce7; color: #166534; }
    .badge-late { background-color: #fef3c7; color: #92400e; }
    .badge-absent { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo.jpg" alt="Logo THPT Vị Thanh" class="h-12 w-12 object-contain shrink-0" onerror="this.onerror=null; this.src='https://via.placeholder.com/48?text=THPT';">
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight">TRƯỜNG THPT VỊ THANH</h1>
          <p class="text-xs text-slate-500">Trang tra cứu điểm danh dành cho Phụ huynh</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Nút chọn file dùng khi thử nghiệm Offline -->
        <label id="btn-offline-upload" class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all">
          <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
          <span>Mở file data.xlsx (Offline)</span>
          <input type="file" id="local-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleLocalFile(event)">
        </label>

        <button onclick="loadDataFromExcel()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Làm mới</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-8 space-y-6">

    <!-- KHU VỰC TÌM KIẾM DÀNH CHO PHỤ HUYNH -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="text-center max-w-md mx-auto space-y-1">
        <h2 class="text-xl font-bold text-slate-800">Tra Cứu Trạng Thái Điểm Danh</h2>
        <p class="text-xs text-slate-500">Nhập tên hoặc chọn lớp của con để kiểm tra thông tin hôm nay</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-input" placeholder="Nhập Họ và Tên học sinh..." 
                 class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium">
        </div>

        <select id="lop-filter" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="ALL">Tất cả Lớp</option>
        </select>
      </div>
    </div>

    <!-- BẢNG HỌC SINH -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div id="loading-spinner" class="py-12 text-center text-slate-400 text-sm flex flex-col items-center justify-center gap-2">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-indigo-600"></i>
        <span id="status-text">Đang tự động nạp dữ liệu từ data.xlsx...</span>
      </div>

      <div class="overflow-x-auto">
        <table id="data-table" class="w-full text-left text-sm hidden">
          <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
            <tr>
              <th class="py-3.5 px-4 w-16 text-center">STT</th>
              <th class="py-3.5 px-4">HỌ VÀ TÊN</th>
              <th class="py-3.5 px-4 text-center">KHỐI</th>
              <th class="py-3.5 px-4 text-center">LỚP</th>
              <th class="py-3.5 px-4 text-center">GIỜ ĐIỂM DANH</th>
              <th class="py-3.5 px-4 text-center">TRẠNG THÁI</th>
            </tr>
          </thead>
          <tbody id="student-table-body" class="divide-y divide-slate-100 text-slate-700">
          </tbody>
        </table>
      </div>

      <div id="pagination-bar" class="p-4 border-t border-slate-200 flex items-center justify-between bg-slate-50 text-sm hidden">
        <span id="pagination-info" class="text-xs text-slate-500">Hiển thị 0 học sinh</span>
        <div class="flex items-center gap-2">
          <button id="btn-prev" onclick="changePage(-1)" class="px-3 py-1.5 border border-slate-200 rounded-lg bg-white text-slate-600 disabled:opacity-50 hover:bg-slate-100 text-xs font-semibold">Trước</button>
          <span id="page-num" class="text-xs font-semibold text-slate-700 px-2">Trang 1 / 1</span>
          <button id="btn-next" onclick="changePage(1)" class="px-3 py-1.5 border border-slate-200 rounded-lg bg-white text-slate-600 disabled:opacity-50 hover:bg-slate-100 text-xs font-semibold">Sau</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let students = [];
    let currentPage = 1;
    const pageSize = 20;

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadDataFromExcel();

      document.getElementById("search-input").addEventListener("input", () => { currentPage = 1; renderTable(); });
      document.getElementById("lop-filter").addEventListener("change", () => { currentPage = 1; renderTable(); });
    });

    // TỰ ĐỘNG NẠP FILE KHI ONLINE (GITHUB)
    function loadDataFromExcel() {
      const spinner = document.getElementById("loading-spinner");
      const statusText = document.getElementById("status-text");
      const table = document.getElementById("data-table");

      spinner.classList.remove("hidden");
      statusText.innerText = "Đang tự động nạp dữ liệu từ data.xlsx...";

      const url = "data.xlsx?v=" + new Date().getTime();

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("CORS_OR_NOT_FOUND");
          return res.arrayBuffer();
        })
        .then(buffer => {
          processExcelBuffer(buffer);
        })
        .catch(err => {
          // Báo lỗi rõ ràng nếu đang mở file Offline trực tiếp
          if (window.location.protocol === "file:") {
            statusText.innerHTML = `
              <span class="text-amber-600 font-semibold">Bạn đang chạy thử trang web dưới dạng Offline (file://).</span><br>
              <span class="text-xs text-slate-500">Trình duyệt chặn tự đọc file local. Vui lòng bấm nút <b>"Mở file data.xlsx (Offline)"</b> ở góc trên bên phải để nạp dữ liệu!</span>
            `;
          } else {
            statusText.innerHTML = `<span class="text-rose-500 font-medium">Chưa có dữ liệu (Không tìm thấy file 'data.xlsx' trên server).</span>`;
          }
        });
    }

    // NẠP THỦ CÔNG KHI CHẠY OFFLINE
    function handleLocalFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        processExcelBuffer(evt.target.result);
      };
      reader.readAsArrayBuffer(file);
    }

    function processExcelBuffer(buffer) {
      try {
        const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });

        parseExcelData(json);

        document.getElementById("loading-spinner").classList.add("hidden");
        document.getElementById("data-table").classList.remove("hidden");
        document.getElementById("pagination-bar").classList.remove("hidden");
      } catch (err) {
        alert("Lỗi khi đọc dữ liệu Excel: " + err.message);
      }
    }

    function parseExcelData(json) {
      if (!json || json.length < 2) return;

      let headerIdx = 0;
      for (let i = 0; i < Math.min(json.length, 10); i++) {
        const rowStr = json[i].join(" ").toUpperCase();
        if (rowStr.includes("HỌ") || rowStr.includes("TÊN") || rowStr.includes("NAME")) {
          headerIdx = i;
          break;
        }
      }

      const headers = json[headerIdx].map(h => String(h || '').trim().toUpperCase());
      let colName = headers.findIndex(h => h.includes("HỌ") || h.includes("TÊN") || h.includes("NAME"));
      let colKhoi = headers.findIndex(h => h.includes("KHỐI") || h.includes("GRADE"));
      let colLop = headers.findIndex(h => h.includes("LỚP") || h.includes("CLASS"));
      let colTime = headers.findIndex(h => h.includes("THỜI GIAN") || h.includes("GIỜ") || h.includes("TIME"));
      let colStatus = headers.findIndex(h => h.includes("TRẠNG THÁI") || h.includes("GHI CHÚ") || h.includes("STATUS"));

      if (colName === -1) colName = 1;
      students = [];

      for (let i = headerIdx + 1; i < json.length; i++) {
        const row = json[i];
        if (!row || !row[colName] || String(row[colName]).trim() === "") continue;

        let nameVal = String(row[colName]).trim();
        let lopVal = colLop !== -1 && row[colLop] ? String(row[colLop]).trim() : "";
        let khoiVal = colKhoi !== -1 && row[colKhoi] ? String(row[colKhoi]).replace(/[^0-9]/g, '') : "";

        if (!khoiVal && lopVal) {
          const match = lopVal.match(/\d+/);
          if (match) khoiVal = match[0];
        }

        students.push({
          stt: students.length + 1,
          name: nameVal,
          khoi: khoiVal || "10",
          lop: lopVal || "Chưa chia",
          time: colTime !== -1 && row[colTime] ? String(row[colTime]).trim() : "--:--",
          status: colStatus !== -1 && row[colStatus] ? String(row[colStatus]).trim() : "ĐÚNG GIỜ"
        });
      }

      populateLopDropdown();
      renderTable();
    }

    function populateLopDropdown() {
      const lopSelect = document.getElementById("lop-filter");
      lopSelect.innerHTML = `<option value="ALL">Tất cả Lớp</option>`;
      const classes = new Set();

      students.forEach(s => { if (s.lop) classes.add(s.lop); });
      Array.from(classes).sort().forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.innerText = `Lớp ${l}`;
        lopSelect.appendChild(opt);
      });
    }

    function renderTable() {
      const tbody = document.getElementById("student-table-body");
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const lop = document.getElementById("lop-filter").value;

      tbody.innerHTML = "";

      const filtered = students.filter(s => {
        const matchName = String(s.name || '').toLowerCase().includes(search);
        const matchLop = lop === "ALL" || String(s.lop) === lop;
        return matchName && matchLop;
      });

      const totalPages = Math.ceil(filtered.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize;
      const pageData = filtered.slice(start, start + pageSize);

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Không tìm thấy học sinh phù hợp</td></tr>`;
      } else {
        pageData.forEach((s, idx) => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-50 transition-colors";

          let badgeClass = "badge-on-time";
          const st = String(s.status || '').toUpperCase();
          if (st.includes("TRỄ") || st.includes("MUỘN")) badgeClass = "badge-late";
          else if (st.includes("VẮNG")) badgeClass = "badge-absent";

          tr.innerHTML = `
            <td class="py-3.5 px-4 text-center text-slate-400 font-medium">${start + idx + 1}</td>
            <td class="py-3.5 px-4 font-semibold text-slate-900">${s.name}</td>
            <td class="py-3.5 px-4 text-center text-slate-500">Khối ${s.khoi}</td>
            <td class="py-3.5 px-4 text-center font-bold text-indigo-600">${s.lop}</td>
            <td class="py-3.5 px-4 text-center font-mono text-slate-600">${s.time}</td>
            <td class="py-3.5 px-4 text-center">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                ${s.status}
              </span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("pagination-info").innerText = `Hiển thị ${filtered.length > 0 ? start + 1 : 0} - ${Math.min(start + pageSize, filtered.length)} trên ${filtered.length} học sinh`;
      document.getElementById("page-num").innerText = `Trang ${currentPage} / ${totalPages}`;
      document.getElementById("btn-prev").disabled = currentPage === 1;
      document.getElementById("btn-next").disabled = currentPage === totalPages;
    }

    function changePage(delta) { currentPage += delta; renderTable(); }
  </script>
</body>
</html>
