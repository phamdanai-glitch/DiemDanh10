<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Điểm Danh Học Sinh</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .admin-box { display: flex; align-items: center; gap: 10px; background: #fff3cd; padding: 8px 12px; border-radius: 4px; border: 1px solid #ffeeba; }
    input[type="password"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-submit { background-color: #28a745; color: white; }
    .btn-submit:hover { background-color: #218838; }
    .btn-history { background-color: #007bff; color: white; }
    .btn-history:hover { background-color: #0069d9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #007bff; color: white; }
    .status-msg { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>BẢNG ĐIỂM DANH HỌC SINH</h2>

  <div class="action-bar">
    <!-- Khối nhập Mật khẩu Admin -->
    <div class="admin-box">
      <label for="adminPassword"><b>Mật khẩu Admin:</b></label>
      <input type="password" id="adminPassword" placeholder="Nhập pass admin...">
    </div>

    <!-- Nút Thao Tác -->
    <div>
      <button class="btn-history" onclick="ghiSangLichSu()">Ghi sang Lịch sử</button>
    </div>
  </div>

  <div id="messageBox" class="status-msg"></div>

  <!-- Bảng Hiển Thị Dữ Liệu Điểm Danh -->
  <table>
    <thead>
      <tr>
        <th>STT</th>
        <th>Mã HS</th>
        <th>Họ và Tên</th>
        <th>Trạng Thái</th>
      </tr>
    </thead>
    <tbody id="attendanceTable">
      <tr>
        <td>1</td>
        <td>HS001</td>
        <td>Nguyễn Văn A</td>
        <td>
          <select class="status-select">
            <option value="Có mặt">Có mặt</option>
            <option value="P">Vắng có phép (P)</option>
            <option value="KP">Vắng không phép (KP)</option>
            <option value="Trễ">Đi trễ</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>2</td>
        <td>HS002</td>
        <td>Trần Thị B</td>
        <td>
          <select class="status-select">
            <option value="Có mặt">Có mặt</option>
            <option value="P" selected>Vắng có phép (P)</option>
            <option value="KP">Vắng không phép (KP)</option>
            <option value="Trễ">Đi trễ</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  function ghiSangLichSu() {
    var password = document.getElementById("adminPassword").value.trim();
    var msgBox = document.getElementById("messageBox");

    // 1. Kiểm tra nếu chưa nhập mật khẩu Admin
    if (!password) {
      alert("Vui lòng nhập Mật khẩu Admin trước khi ghi lịch sử!");
      document.getElementById("adminPassword").focus();
      return;
    }

    // Hiển thị trạng thái đang xử lý
    msgBox.style.display = "block";
    msgBox.style.backgroundColor = "#e2e3e5";
    msgBox.style.color = "#383d41";
    msgBox.innerHTML = "Đang xác thực và ghi lịch sử...";

    // 2. Gửi Yêu cầu POST sang Web App
    var formData = new URLSearchParams();
    formData.append("action", "ghiLichSu");
    formData.append("password", password);

    fetch(window.location.href, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success") {
        msgBox.style.backgroundColor = "#d4edda";
        msgBox.style.color = "#155724";
        msgBox.innerHTML = data.message;
        document.getElementById("adminPassword").value = ""; // Clear pass sau khi ghi thành công
      } else {
        msgBox.style.backgroundColor = "#f8d7da";
        msgBox.style.color = "#721c24";
        msgBox.innerHTML = data.message;
      }
    })
    .catch(error => {
      console.error("Error:", error);
      msgBox.style.backgroundColor = "#f8d7da";
      msgBox.style.color = "#721c24";
      msgBox.innerHTML = "Lỗi kết nối đến máy chủ!";
    });
  }
</script>

</body>
</html>
