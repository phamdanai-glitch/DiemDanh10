<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Duyệt Phép Học Sinh</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f4f4f4; }
    .btn-approve { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-approve:hover { background-color: #218838; }
    .approved { color: #28a745; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Danh sách điểm danh & Duyệt phép</h2>
  <table id="dataTable">
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ tên</th>
        <th>Lớp</th>
        <th>Mã số</th>
        <th>Thời gian</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Link CSV từ Google Sheet (File -> Share -> Publish to web -> Chọn xuất bản CSV)
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv';
    
    // Link Web App URL lấy từ Apps Script sau khi Deploy
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_APPS_SCRIPT_ID/exec';

    async function loadData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        
        // Tách các dòng dữ liệu
        const rows = csvText.split('\n').map(row => row.split(','));
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        // Đọc dữ liệu từ dòng 2 (Bỏ qua tiêu đề ở dòng 1)
        for (let i = 1; i < rows.length; i++) {
          if (!rows[i][0]) continue; // Bỏ qua dòng trống
          
          const rowData = rows[i];
          const rowIndexInSheet = i + 1; // Vị trí dòng thực tế trên Google Sheet

          // Trích xuất dữ liệu theo đúng chỉ số cột
          const stt = rowData[0] || '';       // Cột A
          const hoTen = rowData[1] || '';     // Cột B
          const lop = rowData[2] || '';       // Cột C
          const maSo = rowData[4] || '';      // Cột E
          const trangThai = rowData[16] || 'Chưa duyệt'; // Cột Q
          const thoiGian = rowData[28] || ''; // Cột AC

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${stt}</td>
            <td>${hoTen}</td>
            <td>${lop}</td>
            <td>${maSo}</td>
            <td>${thoiGian}</td>
            <td id="status-${rowIndexInSheet}" class="${trangThai === 'Đã duyệt' ? 'approved' : ''}">${trangThai}</td>
            <td>
              ${trangThai !== 'Đã duyệt' 
                ? `<button class="btn-approve" onclick="approveLeave(${rowIndexInSheet})">Duyệt phép</button>` 
                : '<span class="approved">✓</span>'}
            </td>
          `;
          tbody.appendChild(tr);
        }
      } catch (error) {
        console.error('Lỗi khi tải dữ liệu:', error);
      }
    }

    // Hàm cập nhật trạng thái khi nhấn nút Duyệt
    function approveLeave(rowIndex) {
      // 1. Cập nhật giao diện ngay lập tức (Optimistic UI)
      const statusCell = document.getElementById(`status-${rowIndex}`);
      statusCell.innerText = 'Đã duyệt';
      statusCell.className = 'approved';

      // 2. Gửi request ngầm ghi dữ liệu vào Cột Q trên Google Sheet
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          row: rowIndex, 
          status: 'Đã duyệt' 
        })
      });
    }

    loadData();
  </script>
</body>
</html>
