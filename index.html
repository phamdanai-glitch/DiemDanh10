<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Điểm Danh Trực Tuyến - THPT Vị Thanh</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 50px; height: 50px; border-radius: 50%; }
    .title-group h1 { font-size: 20px; font-weight: 700; color: #1e293b; }
    .sub-title { font-size: 13px; color: #64748b; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; }
    .btn { border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-refresh { background: #f1f5f9; color: #334155; }
    .btn-link { background: #e0f2fe; color: #0369a1; }
    .btn-login { background: #4f46e5; color: #fff; }

    /* Stat Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { padding: 14px 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .stat-card.dung-gio { background: #f0f7ff; border-color: #d0e1fd; color: #1d4ed8; }
    .stat-card.di-tre { background: #fffbeb; border-color: #fef3c7; color: #b45309; }
    .stat-card.co-phep { background: #f0fdf4; border-color: #dcfce7; color: #15803d; }
    .stat-card.khong-quet { background: #f8fafc; border-color: #e2e8f0; color: #475569; }
    .stat-card.khong-phep { background: #fef2f2; border-color: #fee2e2; color: #b91c1c; }
    .stat-label { font-size: 12px; font-weight: 500; }
    .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; }

    /* Filters */
    .filters { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr; gap: 12px; margin-bottom: 20px; }
    .filter-input, .filter-select { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 13px; outline: none; background: #f8fafc; }

    /* Data Table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px 14px; font-size: 12px; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    .badge-lop { background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }

    /* Badges Status */
    .badge-status { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .status-DUNG-GIO { background: #dbeafe; color: #1e40af; }
    .status-PHEP { background: #dcfce7; color: #166534; }
    .status-KHONG-QUET { background: #e2e8f0; color: #475569; }
    .status-KHONG-PHEP { background: #fee2e2; color: #991b1b; }
    .status-DI-TRE { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="https://via.placeholder.com/50" alt="Logo" class="logo">
      <div class="title-group">
        <h1>Quản Lý Điểm Danh Trực Tuyến</h1>
        <div class="sub-title">Trường THPT Vị Thanh • Hiển thị: <b id="lblCount">0 / 0</b> học sinh</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-refresh" onclick="loadData()">🔄 Làm Mới</button>
      <button class="btn btn-link">🔗 Link Phụ Huynh</button>
      <button class="btn btn-login">➡️ Đăng Nhập Quản Lý</button>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stats-grid">
    <div class="stat-card dung-gio"><div class="stat-label">Đúng giờ</div><div class="stat-value" id="stDungGio">0</div></div>
    <div class="stat-card di-tre"><div class="stat-label">Đi trễ</div><div class="stat-value" id="stDiTre">0</div></div>
    <div class="stat-card co-phep"><div class="stat-label">Vắng có phép</div><div class="stat-value" id="stCoPhep">0</div></div>
    <div class="stat-card khong-quet"><div class="stat-label">Không quét thẻ</div><div class="stat-value" id="stKhongQuet">0</div></div>
    <div class="stat-card khong-phep"><div class="stat-label">Không phép</div><div class="stat-value" id="stKhongPhep">0</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input type="text" id="txtSearch" class="filter-input" placeholder="🔍 Tìm kiếm theo tên hoặc mã HS..." oninput="filterData()">
    <select id="ddlLop" class="filter-select" onchange="filterData()">
      <option value="">-- Tất cả các lớp --</option>
    </select>
    <select id="ddlTrangThai" class="filter-select" onchange="filterData()">
      <option value="">-- Tất cả trạng thái --</option>
      <option value="ĐÚNG GIỜ">ĐÚNG GIỜ</option>
      <option value="PHÉP">PHÉP</option>
      <option value="KHÔNG QUÉT">KHÔNG QUÉT</option>
      <option value="KHÔNG PHÉP">KHÔNG PHÉP</option>
      <option value="ĐI TRỄ">ĐI TRỄ</option>
    </select>
  </div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ và Tên</th>
        <th>Lớp</th>
        <th>Mã HS</th>
        <th>Thời Gian</th>
        <th>Trạng Thái</th>
      </tr>
    </thead>
    <tbody id="tbBody"></tbody>
  </table>
</div>

<script>
  // 1. Link CSV lấy từ File -> Share -> Publish to web (Export dạng CSV)
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv';
  
  // 2. Link Apps Script Web App đã Deploy
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_APPS_SCRIPT_ID/exec';

  let rawData = [];

  async function loadData() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csv = await res.text();
      const rows = csv.split('\n').map(r => r.split(','));

      rawData = [];
      const lopSet = new Set();

      for (let i = 1; i < rows.length; i++) {
        if (!rows[i][0]) continue;
        const r = rows[i];
        
        const item = {
          rowIndex: i + 1,
          stt: r[0]?.trim() || '',       // Cột A
          hoTen: r[1]?.trim() || '',     // Cột B
          lop: r[2]?.trim() || '',       // Cột C
          maHS: r[4]?.trim() || '',      // Cột E
          trangThai: r[16]?.trim() || 'KHÔNG QUÉT', // Cột Q
          thoiGian: r[28]?.trim() || ''  // Cột AC
        };

        rawData.push(item);
        if (item.lop) lopSet.add(item.lop);
      }

      // Nạp danh sách lớp vào Dropdown
      const ddlLop = document.getElementById('ddlLop');
      ddlLop.innerHTML = `<option value="">-- Tất cả các lớp (${lopSet.size}) --</option>`;
      Array.from(lopSet).sort().forEach(l => {
        ddlLop.innerHTML += `<option value="${l}">${l}</option>`;
      });

      filterData();
    } catch (e) {
      console.error('Lỗi khi tải dữ liệu:', e);
    }
  }

  function filterData() {
    const search = document.getElementById('txtSearch').value.toLowerCase();
    const selectedLop = document.getElementById('ddlLop').value;
    const selectedTT = document.getElementById('ddlTrangThai').value;

    let filtered = rawData.filter(item => {
      const matchSearch = item.hoTen.toLowerCase().includes(search) || item.maHS.toLowerCase().includes(search);
      const matchLop = !selectedLop || item.lop === selectedLop;
      const matchTT = !selectedTT || item.trangThai === selectedTT;
      return matchSearch && matchLop && matchTT;
    });

    renderTable(filtered);
    updateStats(rawData);
  }

  function renderTable(list) {
    const tbody = document.getElementById('tbBody');
    document.getElementById('lblCount').innerText = `${list.length} / ${rawData.length}`;
    tbody.innerHTML = '';

    list.forEach(item => {
      const statusClass = 'status-' + item.trangThai.replace(/\s+/g, '-');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.stt}</td>
        <td><b>${item.hoTen}</b></td>
        <td><span class="badge-lop">${item.lop}</span></td>
        <td>${item.maHS}</td>
        <td>${item.thoiGian}</td>
        <td>
          <span class="badge-status ${statusClass}" onclick="toggleStatus(${item.rowIndex}, '${item.trangThai}')">
            ${item.trangThai}
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateStats(list) {
    let dungGio = 0, diTre = 0, coPhep = 0, khongQuet = 0, khongPhep = 0;
    list.forEach(i => {
      if (i.trangThai === 'ĐÚNG GIỜ') dungGio++;
      else if (i.trangThai === 'ĐI TRỄ') diTre++;
      else if (i.trangThai === 'PHÉP') coPhep++;
      else if (i.trangThai === 'KHÔNG PHÉP') khongPhep++;
      else khongQuet++;
    });

    document.getElementById('stDungGio').innerText = dungGio;
    document.getElementById('stDiTre').innerText = diTre;
    document.getElementById('stCoPhep').innerText = coPhep;
    document.getElementById('stKhongQuet').innerText = khongQuet;
    document.getElementById('stKhongPhep').innerText = khongPhep;
  }

  // Cập nhật trạng thái ngược về Google Sheet khi click vào Badge
  function toggleStatus(rowIndex, currentStatus) {
    const newStatus = currentStatus === 'PHÉP' ? 'KHÔNG PHÉP' : 'PHÉP';
    
    // Đổi giao diện tức thì (Optimistic UI)
    const target = rawData.find(x => x.rowIndex === rowIndex);
    if (target) target.trangThai = newStatus;
    filterData();

    // Gửi dữ liệu cập nhật về Cột Q trên Google Sheet
    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ row: rowIndex, status: newStatus })
    });
  }

  loadData();
</script>
</body>
</html>
