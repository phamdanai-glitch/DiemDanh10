<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu & Duyệt Điểm Danh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-6">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-800" id="header-title">Tra Cứu & Duyệt Điểm Danh</h1>
        <p class="text-xs text-slate-400 mt-1">Trường THPT Vị Thanh — Tổng số học sinh: <span id="total-students" class="font-bold text-indigo-600">0</span></p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- NÚT LINK PHỤ HUYNH -->
        <button onclick="copyParentLink()" title="Sao chép đường link dành riêng cho phụ huynh tra cứu" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 transition-all cursor-pointer">
          <i data-lucide="share-2" class="w-4 h-4 text-indigo-600"></i>
          <span>Link Cho Phụ Huynh</span>
        </button>

        <!-- NÚT GVCN DUYỆT CÓ PHÉP (Chỉ hiện ở mode GVCN) -->
        <button id="btn-approve" onclick="approveSelected()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition-all cursor-pointer">
          <i data-lucide="shield-check" class="w-4 h-4"></i> GVCN Duyệt Có Phép
        </button>
      </div>
    </div>

    <!-- BỘ LỌC TÌM KIẾM & LỚP -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input type="text" id="search-input" oninput="filterData()" placeholder="🔍 Tìm theo tên hoặc mã HS..." class="px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <select id="class-filter" onchange="filterData()" class="px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <option value="">-- Tất cả các lớp --</option>
      </select>
      <select id="status-filter" onchange="filterData()" class="px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <option value="">-- Tất cả trạng thái --</option>
        <option value="ĐI TRỄ">ĐI TRỄ</option>
        <option value="VẮNG KHÔNG PHÉP">VẮNG KHÔNG PHÉP</option>
        <option value="VẮNG CÓ PHÉP">VẮNG CÓ PHÉP</option>
      </select>
    </div>

    <!-- CẤU HÌNH GITHUB (Chỉ hiện ở mode GVCN) -->
    <details id="github-config-box" class="text-xs bg-slate-50 p-4 rounded-xl border border-slate-200">
      <summary class="font-bold text-slate-700 cursor-pointer flex items-center gap-2">
        <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i> Cấu hình kết nối GitHub (BQT / GVCN)
      </summary>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mt-3">
        <input type="text" id="gh-user" placeholder="User GitHub..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="text" id="gh-repo" placeholder="Tên Repo..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="saveGithubConfig()" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl px-4 py-2 transition-all">Lưu & Tải Dữ Liệu</button>
      </div>
    </details>

    <!-- BẢNG DỮ LIỆU -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 font-semibold">
            <th class="p-3 col-checkbox"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
            <th class="p-3">STT</th>
            <th class="p-3">Họ và Tên</th>
            <th class="p-3">Lớp</th>
            <th class="p-3">Mã HS</th>
            <th class="p-3">Thời gian</th>
            <th class="p-3">Trạng thái</th>
          </tr>
        </thead>
        <tbody id="attendance-tbody" class="divide-y divide-slate-100">
          <tr>
            <td colspan="7" class="p-6 text-center text-slate-400">Đang tải dữ liệu điểm danh...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- POPUP XÁC THỰC MẬT KHẨU GVCN -->
  <div id="password-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="lock" class="w-5 h-5 text-indigo-600"></i> Xác Thực GVCN
        </h3>
        <button onclick="closePasswordModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Lớp duyệt phép</label>
          <input type="text" id="modal-class-input" placeholder="Ví dụ: 10A1" class="w-full px-3 py-2 border rounded-xl text-sm font-semibold uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu GVCN</label>
          <input type="password" id="modal-pass-input" placeholder="Nhập mật khẩu..." class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closePasswordModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold">Hủy</button>
        <button id="btn-confirm-approval" onclick="confirmApproval()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
          <i data-lucide="check-circle" class="w-4 h-4"></i> Xác Nhận
        </button>
      </div>
    </div>
  </div>

  <script>
    const CLASS_PASSWORDS = {
      "10A1": "123456", "10A2": "123456", "10A3": "123456", "10A4": "123456", "10A5": "123456",
      "10A6": "123456", "10A7": "123456", "10A8": "123456", "10A9": "123456", "10A10": "123456", "10A11": "123456",
      "11A1": "123456", "11A2": "123456", "11A3": "123456", "11A4": "123456", "11A5": "123456",
      "11A6": "123456", "11A7": "123456", "11A8": "123456", "11A9": "123456", "11A10": "123456", "11A11": "123456",
      "12A1": "123456", "12A2": "123456", "12A3": "123456", "12A4": "123456", "12A5": "123456",
      "12A6": "123456", "12A7": "123456", "12A8": "123456", "12A9": "123456", "12A10": "123456", "12A11": "123456"
    };

    let allStudents = [];
    let filteredStudents = [];
    let rawWorkbook = null;
    let currentSheetName = "";
    let fileSha = "";
    let pendingStudents = [];
    let isParentMode = false;

    function cleanInput(str) {
      if (!str) return "";
      let cleaned = str.trim().replace(/\/$/, "");
      if (cleaned.includes("github.com/")) {
        cleaned = cleaned.split("github.com/")[1];
      }
      return cleaned.split('/')[0];
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Kiểm tra xem có tham số ?mode=phuhuynh trên URL không
      const urlParams = new URLSearchParams(window.location.search);
      isParentMode = urlParams.get('mode') === 'phuhuynh';

      applyModeUI();
      lucide.createIcons();
      loadGithubConfig();
      fetchAttendanceData();
    });

    function applyModeUI() {
      if (isParentMode) {
        document.getElementById("header-title").innerText = "Tra Cứu Điểm Danh (Dành Cho Phụ Huynh)";
        document.getElementById("btn-approve").classList.add("hidden");
        document.getElementById("github-config-box").classList.add("hidden");
        
        // Ẩn cột Checkbox trong bảng
        const checkboxCols = document.querySelectorAll(".col-checkbox");
        checkboxCols.forEach(col => col.classList.add("hidden"));
      } else {
        document.getElementById("header-title").innerText = "Tra Cứu & Duyệt Điểm Danh";
        document.getElementById("btn-approve").classList.remove("hidden");
        document.getElementById("github-config-box").classList.remove("hidden");

        const checkboxCols = document.querySelectorAll(".col-checkbox");
        checkboxCols.forEach(col => col.classList.remove("hidden"));
      }
    }

    function copyParentLink() {
      const parentUrl = window.location.origin + window.location.pathname + "?mode=phuhuynh";
      navigator.clipboard.writeText(parentUrl).then(() => {
        alert("Đã sao chép link dành cho Phụ huynh vào bộ nhớ tạm:\n" + parentUrl);
      }).catch(() => {
        prompt("Sao chép đường link dưới đây để gửi cho Phụ huynh:", parentUrl);
      });
    }

    function loadGithubConfig() {
      document.getElementById("gh-user").value = localStorage.getItem("gh_user") || "phamdanai-glitch";
      document.getElementById("gh-repo").value = localStorage.getItem("gh_repo") || "DiemDanh10";
      document.getElementById("gh-token").value = localStorage.getItem("gh_token") || "";
    }

    function saveGithubConfig() {
      const user = cleanInput(document.getElementById("gh-user").value);
      const repo = cleanInput(document.getElementById("gh-repo").value);
      const token = document.getElementById("gh-token").value.trim();

      localStorage.setItem("gh_user", user);
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);

      alert("Đã lưu cấu hình GitHub!");
      fetchAttendanceData();
    }

    async function fetchAttendanceData() {
      let user = cleanInput(localStorage.getItem("gh_user") || "phamdanai-glitch");
      let repo = cleanInput(localStorage.getItem("gh_repo") || "DiemDanh10");
      const token = localStorage.getItem("gh_token");
      const tbody = document.getElementById("attendance-tbody");

      const colSpan = isParentMode ? 6 : 7;
      tbody.innerHTML = `<tr><td colspan="${colSpan}" class="p-6 text-center text-slate-400">Đang tải dữ liệu điểm danh...</td></tr>`;

      try {
        let arrayBuffer = null;

        // Ưu tiên 1: Lấy qua Raw github
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/data.xlsx?v=${Date.now()}`;
        try {
          const rawRes = await fetch(rawUrl);
          if (rawRes.ok) {
            arrayBuffer = await rawRes.arrayBuffer();
          }
        } catch (e) {
          console.warn("Raw fetch failed, trying API...", e);
        }

        // Ưu tiên 2: GitHub API
        if (!arrayBuffer) {
          const headers = token ? { "Authorization": `token ${token}` } : {};
          const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.xlsx`, { headers });
          if (!response.ok) throw new Error("Không thể tải file data.xlsx!");

          const data = await response.json();
          fileSha = data.sha;
          const binaryString = atob(data.content.replace(/\s/g, ''));
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          arrayBuffer = bytes.buffer;
        }

        rawWorkbook = XLSX.read(arrayBuffer, { type: 'array' });
        currentSheetName = rawWorkbook.SheetNames.includes("data") ? "data" : rawWorkbook.SheetNames[0];
        const worksheet = rawWorkbook.Sheets[currentSheetName];

        const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:Z2000');
        allStudents = [];

        for (let r = 4; r <= range.e.r; r++) {
          const nameCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 1 })]; // Cột B: Họ và Tên
          const lopCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 2 })];  // Cột C: Lớp
          const maHsCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 4 })]; // Cột E: Mã HS
          const treCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 5 })];  // Cột F: Trễ
          const timeCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 10 })];// Cột K: Thời gian
          const phepCell = worksheet[XLSX.utils.encode_cell({ r: r, c: 15 })];// Cột P: VẮNG CÓ PHÉP

          if (!nameCell || !nameCell.v) continue;

          let name = String(nameCell.v).trim();
          if (name === "" || name.includes("HỌ VÀ TÊN") || name.includes("Tiêu đề")) continue;

          let lop = lopCell && lopCell.v ? String(lopCell.v).trim().toUpperCase() : "---";
          let maHs = maHsCell && maHsCell.v ? String(maHsCell.v).trim() : "---";
          let timeVal = timeCell && timeCell.v ? String(timeCell.v).trim() : "---";
          let treVal = treCell && treCell.v ? String(treCell.v).trim() : "";
          let phepVal = phepCell && phepCell.v ? String(phepCell.v).trim() : "";

          // Phân loại trạng thái điểm danh
          let status = "VẮNG KHÔNG PHÉP";
          if (treVal !== "") {
            status = "ĐI TRỄ";
          } else if (phepVal.toLowerCase() === "x" || phepVal.toLowerCase() === "p" || phepVal.includes("Có phép") || phepVal === "P") {
            status = "VẮNG CÓ PHÉP";
          }

          allStudents.push({
            rowIdx: r + 1, // Dòng Excel 1-indexed
            name: name,
            lop: lop,
            maHs: maHs,
            time: timeVal,
            status: status,
            selected: false
          });
        }

        document.getElementById("total-students").innerText = allStudents.length;

        const classes = [...new Set(allStudents.map(s => s.lop))].sort();
        const classSelect = document.getElementById("class-filter");
        classSelect.innerHTML = `<option value="">-- Tất cả các lớp (${classes.length}) --</option>` + 
          classes.map(c => `<option value="${c}">${c}</option>`).join('');

        filterData();

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="p-6 text-center text-rose-500 font-medium">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
      }
    }

    function filterData() {
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const selectedClass = document.getElementById("class-filter").value;
      const selectedStatus = document.getElementById("status-filter").value;

      filteredStudents = allStudents.filter(s => {
        const matchSearch = !search || s.name.toLowerCase().includes(search) || s.maHs.toLowerCase().includes(search);
        const matchClass = !selectedClass || s.lop === selectedClass;
        const matchStatus = !selectedStatus || s.status === selectedStatus;
        return matchSearch && matchClass && matchStatus;
      });

      renderTable();
    }

    function toggleSelectAll(master) {
      filteredStudents.forEach(s => s.selected = master.checked);
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("attendance-tbody");
      const colSpan = isParentMode ? 6 : 7;

      if (!filteredStudents || filteredStudents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="p-6 text-center text-slate-400">Không tìm thấy danh sách học sinh phù hợp.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredStudents.map((s, idx) => {
        let badgeStyle = "bg-rose-100 text-rose-700"; // Vắng không phép
        if (s.status === "ĐI TRỄ") {
          badgeStyle = "bg-amber-100 text-amber-800";
        } else if (s.status === "VẮNG CÓ PHÉP") {
          badgeStyle = "bg-emerald-100 text-emerald-700";
        }

        const checkboxTd = isParentMode ? '' : `<td class="p-3 col-checkbox"><input type="checkbox" ${s.selected ? 'checked' : ''} onchange="toggleStudentSelect(${idx}, this.checked)"></td>`;

        return `
          <tr class="hover:bg-slate-50 transition-colors">
            ${checkboxTd}
            <td class="p-3 text-slate-400 font-medium">${idx + 1}</td>
            <td class="p-3 font-semibold text-slate-800">${s.name}</td>
            <td class="p-3"><span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">${s.lop}</span></td>
            <td class="p-3 text-slate-500 font-mono text-xs">${s.maHs}</td>
            <td class="p-3 text-slate-500 font-mono text-xs">${s.time}</td>
            <td class="p-3">
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${badgeStyle}">
                ${s.status}
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleStudentSelect(index, isChecked) {
      if (filteredStudents[index]) {
        filteredStudents[index].selected = isChecked;
      }
    }

    function approveSelected() {
      const user = cleanInput(localStorage.getItem("gh_user"));
      const repo = cleanInput(localStorage.getItem("gh_repo"));
      const token = localStorage.getItem("gh_token");

      if (!user || !repo || !token) {
        alert("Để lưu trực tiếp lên GitHub, bạn cần nhập GitHub Token vào mục Cấu hình!");
        return;
      }

      pendingStudents = filteredStudents.filter(s => s.selected);
      if (pendingStudents.length === 0) {
        alert("Vui lòng tích chọn ít nhất 1 học sinh để duyệt có phép.");
        return;
      }

      const selectedClasses = [...new Set(pendingStudents.map(s => s.lop))];
      document.getElementById("modal-class-input").value = selectedClasses.length === 1 && selectedClasses[0] !== "---" ? selectedClasses[0] : "";
      document.getElementById("modal-pass-input").value = "";

      document.getElementById("password-modal").classList.remove("hidden");
    }

    function closePasswordModal() {
      document.getElementById("password-modal").classList.add("hidden");
    }

    async function confirmApproval() {
      const targetClass = document.getElementById("modal-class-input").value.trim().toUpperCase();
      const inputPass = document.getElementById("modal-pass-input").value.trim();

      if (!CLASS_PASSWORDS[targetClass] || inputPass !== CLASS_PASSWORDS[targetClass]) {
        alert(`Mật khẩu GVCN Lớp ${targetClass} không chính xác!`);
        return;
      }

      const confirmBtn = document.getElementById("btn-confirm-approval");
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = "Đang xử lý...";

      const worksheet = rawWorkbook.Sheets[currentSheetName];
      let count = 0;

      pendingStudents.forEach(s => {
        if (s.status === "VẮNG KHÔNG PHÉP") {
          s.status = "VẮNG CÓ PHÉP";
          s.selected = false;
          
          // Điền "P" vào Cột P (Cột 16, index 15)
          const phepCellAddr = XLSX.utils.encode_cell({ r: s.rowIdx - 1, c: 15 });
          worksheet[phepCellAddr] = { t: 's', v: 'P' };
          count++;
        }
      });

      if (count === 0) {
        alert(`Các học sinh được chọn đã ở trạng thái Có phép.`);
        closePasswordModal();
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Xác Nhận`;
        lucide.createIcons();
        return;
      }

      const user = cleanInput(localStorage.getItem("gh_user"));
      const repo = cleanInput(localStorage.getItem("gh_repo"));
      const token = localStorage.getItem("gh_token");

      try {
        const wbout = XLSX.write(rawWorkbook, { bookType: 'xlsx', type: 'base64' });

        // Tải SHA mới nhất từ GitHub
        const getShaRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.xlsx`, {
          headers: { "Authorization": `token ${token}` }
        });
        if (getShaRes.ok) {
          const getShaData = await getShaRes.json();
          fileSha = getShaData.sha;
        }

        const bodyData = {
          message: `GVCN Lớp ${targetClass} duyệt có phép cho ${count} học sinh`,
          content: wbout,
          sha: fileSha
        };

        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.xlsx`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        const resJson = await response.json();

        if (response.ok) {
          fileSha = resJson.content.sha;
          alert(`Thành công! Đã duyệt có phép cho ${count} học sinh và lưu lên GitHub.`);
          closePasswordModal();
          filterData();
        } else {
          alert("Lỗi khi ghi đè file Excel: " + (resJson.message || "Token không đủ quyền ghi (contents: write)"));
        }
      } catch (err) {
        alert("Lỗi kết nối GitHub API: " + err.message);
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Xác Nhận`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
