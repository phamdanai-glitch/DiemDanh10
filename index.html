<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu & Duyệt Điểm Danh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-6">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Tra Cứu & Duyệt Điểm Danh</h1>
        <p class="text-xs text-slate-400 mt-1">Dữ liệu điểm danh ngày <span id="current-date">20/09/2026</span></p>
      </div>
      <button onclick="approveSelected()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition-all">
        <i data-lucide="shield-check" class="w-4 h-4"></i> GVCN Duyệt Có Phép
      </button>
    </div>

    <!-- CẤU HÌNH GITHUB (MẶC ĐỊNH MỞ CHO BQT) -->
    <details open class="text-xs bg-slate-50 p-4 rounded-xl border border-slate-200">
      <summary class="font-bold text-slate-700 cursor-pointer flex items-center gap-2">
        <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i> Cấu hình kết nối GitHub (Dành cho BQT)
      </summary>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mt-3">
        <input type="text" id="gh-user" placeholder="User GitHub..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="text" id="gh-repo" placeholder="Tên Repo..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="password" id="gh-token" placeholder="GitHub Token..." class="px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 md:col-span-1">
        <button onclick="saveGithubConfig()" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl px-4 py-2 transition-all">Lưu & Tải Dữ Liệu</button>
      </div>
      
      <!-- KHU VỰC DEBUG/SOI FILE EXCEL -->
      <div id="debug-info" class="mt-3 p-3 bg-slate-200 rounded-lg text-slate-700 text-[11px] font-mono overflow-x-auto hidden"></div>
    </details>

    <!-- KHU VỰC HIỂN THỊ DỮ LIỆU / BẢNG -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 font-semibold">
            <th class="p-3"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
            <th class="p-3">STT</th>
            <th class="p-3">Họ và Tên</th>
            <th class="p-3">Lớp</th>
            <th class="p-3">Trạng thái</th>
          </tr>
        </thead>
        <tbody id="attendance-tbody" class="divide-y divide-slate-100">
          <tr>
            <td colspan="5" class="p-6 text-center text-slate-400">Đang tải dữ liệu điểm danh từ GitHub...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- POPUP XÁC THỰC MẬT KHẨU GVCN -->
  <div id="password-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="lock" class="w-5 h-5 text-indigo-600"></i> Xác Thực GVCN
        </h3>
        <button onclick="closePasswordModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Lớp duyệt phép</label>
          <input type="text" id="modal-class-input" placeholder="Ví dụ: 10A1" class="w-full px-3 py-2 border rounded-xl text-sm font-semibold uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu GVCN</label>
          <input type="password" id="modal-pass-input" placeholder="Nhập mật khẩu..." class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closePasswordModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold">Hủy</button>
        <button onclick="confirmApproval()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
          <i data-lucide="check-circle" class="w-4 h-4"></i> Xác Nhận
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT XỬ LÝ -->
  <script>
    const CLASS_PASSWORDS = {
      "10A1": "123456", "10A2": "123456", "10A3": "123456", "10A4": "123456", "10A5": "123456",
      "10A6": "123456", "10A7": "123456", "10A8": "123456", "10A9": "123456", "10A10": "123456", "10A11": "123456",
      "11A1": "123456", "11A2": "123456", "11A3": "123456", "11A4": "123456", "11A5": "123456",
      "11A6": "123456", "11A7": "123456", "11A8": "123456", "11A9": "123456", "11A10": "123456", "11A11": "123456",
      "12A1": "123456", "12A2": "123456", "12A3": "123456", "12A4": "123456", "12A5": "123456",
      "12A6": "123456", "12A7": "123456", "12A8": "123456", "12A9": "123456", "12A10": "123456"
    };

    let students = [];
    let rawExcelJson = null;
    let currentSheetName = "";
    let fileSha = "";
    let pendingStudents = [];
    let colIndices = { name: 1, lop: 2, coPhep: 15, khongPhep: 16 };

    function cleanInput(str) {
      if (!str) return "";
      let cleaned = str.trim().replace(/\/$/, "");
      if (cleaned.includes("github.com/")) {
        cleaned = cleaned.split("github.com/")[1];
      }
      return cleaned.split('/')[0];
    }

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadGithubConfig();
      fetchAttendanceData();
    });

    function loadGithubConfig() {
      document.getElementById("gh-user").value = localStorage.getItem("gh_user") || "phamdanai-glitch";
      document.getElementById("gh-repo").value = localStorage.getItem("gh_repo") || "DiemDanh10";
      document.getElementById("gh-token").value = localStorage.getItem("gh_token") || "";
    }

    function saveGithubConfig() {
      const user = cleanInput(document.getElementById("gh-user").value);
      const repo = cleanInput(document.getElementById("gh-repo").value);
      const token = document.getElementById("gh-token").value.trim();

      document.getElementById("gh-user").value = user;
      document.getElementById("gh-repo").value = repo;

      localStorage.setItem("gh_user", user);
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);

      alert("Đã lưu cấu hình GitHub thành công!");
      fetchAttendanceData();
    }

    async function fetchAttendanceData() {
      let user = cleanInput(localStorage.getItem("gh_user") || "phamdanai-glitch");
      let repo = cleanInput(localStorage.getItem("gh_repo") || "DiemDanh10");
      const token = localStorage.getItem("gh_token");
      const tbody = document.getElementById("attendance-tbody");
      const debugDiv = document.getElementById("debug-info");

      if (!user || !repo) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-amber-600 font-semibold">Vui lòng nhập "User GitHub" và "Tên Repo" trong mục Cấu hình rồi bấm "Lưu & Tải Dữ Liệu".</td></tr>`;
        return;
      }

      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Đang tải dữ liệu điểm danh từ GitHub...</td></tr>`;

      try {
        const headers = token ? { "Authorization": `token ${token}` } : {};
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.xlsx`, { headers });

        if (!response.ok) {
          throw new Error("Không tìm thấy file data.xlsx hoặc thông tin Repo/User/Token không chính xác!");
        }

        const data = await response.json();
        fileSha = data.sha;

        const binaryString = atob(data.content.replace(/\s/g, ''));
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const workbook = XLSX.read(bytes.buffer, { type: 'array' });
        
        // Chọn Sheet đầu tiên có dữ liệu
        currentSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[currentSheetName];
        rawExcelJson = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        // Hiện debug info
        debugDiv.classList.remove("hidden");
        let debugText = `Sheets found: [${workbook.SheetNames.join(", ")}]\nReading Sheet: "${currentSheetName}" (Rows: ${rawExcelJson.length})\nFirst 3 rows:\n`;
        rawExcelJson.slice(0, 3).forEach((r, idx) => {
          debugText += `Row ${idx}: ${JSON.stringify(r)}\n`;
        });
        debugDiv.innerText = debugText;

        if (!rawExcelJson || rawExcelJson.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">File Excel trống.</td></tr>`;
          return;
        }

        // TỰ ĐỘNG TÌM CỘT TÊN VÀ CỘT LỚP
        colIndices = { name: -1, lop: -1, coPhep: -1, khongPhep: -1 };
        let headerRowIdx = -1;

        for (let r = 0; r < Math.min(rawExcelJson.length, 15); r++) {
          const row = rawExcelJson[r];
          if (!row) continue;

          row.forEach((cell, cIdx) => {
            const val = String(cell || "").toLowerCase().trim();
            if (val.includes("tên") || val.includes("họ") || val.includes("học sinh")) {
              if (colIndices.name === -1) colIndices.name = cIdx;
            }
            if (val.includes("lớp") || val.includes("class")) {
              if (colIndices.lop === -1) colIndices.lop = cIdx;
            }
            if (val.includes("có phép") || val.includes("phep")) {
              if (colIndices.coPhep === -1) colIndices.coPhep = cIdx;
            }
            if (val.includes("không phép") || val.includes("khong phep")) {
              if (colIndices.khongPhep === -1) colIndices.khongPhep = cIdx;
            }
          });

          if (colIndices.name !== -1 || colIndices.lop !== -1) {
            headerRowIdx = r;
            break;
          }
        }

        // Fallback mặc định nếu không tìm thấy chuỗi tiêu đề
        if (colIndices.name === -1) colIndices.name = 1; // Cột B
        if (colIndices.lop === -1) colIndices.lop = 2;  // Cột C
        if (colIndices.coPhep === -1) colIndices.coPhep = 15;
        if (colIndices.khongPhep === -1) colIndices.khongPhep = 16;

        students = [];
        const startRow = headerRowIdx !== -1 ? headerRowIdx + 1 : 0;

        for (let i = startRow; i < rawExcelJson.length; i++) {
          const row = rawExcelJson[i];
          if (!row || row.length === 0) continue;

          // Thử lấy Họ Tên từ cột phát hiện hoặc cột 0/1/2
          let name = row[colIndices.name] || row[1] || row[0] || "";
          let lop = row[colIndices.lop] || row[2] || row[1] || "";

          name = String(name).trim();
          lop = String(lop).trim().toUpperCase();

          // Bỏ qua nếu dòng này không chứa tên học sinh
          if (!name || name.toLowerCase().includes("họ và tên") || name.toLowerCase().includes("stt")) continue;

          const coPhepVal = row[colIndices.coPhep] ? String(row[colIndices.coPhep]).trim() : "";
          
          let status = "VẮNG KHÔNG PHÉP";
          if (coPhepVal && coPhepVal.toLowerCase() !== "false" && coPhepVal !== "0") {
            status = "VẮNG CÓ PHÉP";
          }

          students.push({
            id: i,
            name: name,
            lop: lop || "---",
            status: status,
            selected: false
          });
        }

        renderTable();

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-500 font-medium">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
      }
    }

    function approveSelected() {
      const user = cleanInput(localStorage.getItem("gh_user"));
      const repo = cleanInput(localStorage.getItem("gh_repo"));
      const token = localStorage.getItem("gh_token");

      if (!user || !repo || !token) {
        alert("Vui lòng mở 'Cấu hình kết nối GitHub' và nhập đầy đủ User GitHub, Tên Repo và Token!");
        return;
      }

      pendingStudents = students.filter(s => s.selected);
      if (pendingStudents.length === 0) {
        alert("Vui lòng tích chọn ít nhất 1 học sinh để duyệt có phép.");
        return;
      }

      const selectedClasses = [...new Set(pendingStudents.map(s => s.lop))];
      const classInput = document.getElementById("modal-class-input");
      classInput.value = selectedClasses.length === 1 && selectedClasses[0] !== "---" ? selectedClasses[0] : "";
      document.getElementById("modal-pass-input").value = "";

      document.getElementById("password-modal").classList.remove("hidden");
      document.getElementById("modal-pass-input").focus();
    }

    function closePasswordModal() {
      document.getElementById("password-modal").classList.add("hidden");
    }

    async function confirmApproval() {
      const targetClass = document.getElementById("modal-class-input").value.trim().toUpperCase();
      const inputPass = document.getElementById("modal-pass-input").value.trim();

      if (!targetClass) {
        alert("Vui lòng nhập Tên Lớp!");
        return;
      }

      if (!CLASS_PASSWORDS[targetClass]) {
        alert(`Lớp '${targetClass}' không tồn tại trong danh sách 32 lớp!`);
        return;
      }

      if (inputPass !== CLASS_PASSWORDS[targetClass]) {
        alert(`Mật khẩu GVCN Lớp ${targetClass} KHÔNG CHÍNH XÁC!`);
        return;
      }

      const otherClassStudents = pendingStudents.filter(s => s.lop !== "---" && s.lop !== targetClass);
      if (otherClassStudents.length > 0) {
        alert(`CẢNH BÁO: Bạn chọn học sinh thuộc lớp khác! GVCN lớp ${targetClass} chỉ được duyệt cho học sinh Lớp ${targetClass}.`);
        return;
      }

      closePasswordModal();

      let count = 0;
      pendingStudents.forEach(s => {
        if (s.status === "VẮNG KHÔNG PHÉP") {
          s.status = "VẮNG CÓ PHÉP";
          s.selected = false;
          
          if (rawExcelJson && rawExcelJson[s.id]) {
            rawExcelJson[s.id][colIndices.coPhep] = "Có phép";
            if (colIndices.khongPhep !== -1) {
              rawExcelJson[s.id][colIndices.khongPhep] = "";
            }
          }
          count++;
        }
      });

      if (count === 0) {
        alert(`Tất cả học sinh được chọn thuộc lớp ${targetClass} đã ở trạng thái Có phép!`);
        return;
      }

      const user = cleanInput(localStorage.getItem("gh_user"));
      const repo = cleanInput(localStorage.getItem("gh_repo"));
      const token = localStorage.getItem("gh_token");

      try {
        const ws = XLSX.utils.aoa_to_sheet(rawExcelJson);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, currentSheetName || "Sheet1");

        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

        const bodyData = {
          message: `GVCN Lớp ${targetClass} duyệt có phép cho ${count} học sinh`,
          content: wbout
        };

        if (fileSha) bodyData.sha = fileSha;

        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.xlsx`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        const resJson = await response.json();

        if (response.ok) {
          fileSha = resJson.content.sha;
          alert(`THÀNH CÔNG!\nGVCN Lớp ${targetClass} đã duyệt phép cho ${count} học sinh và lưu trực tiếp lên GitHub.`);
          renderTable();
        } else {
          alert("Lỗi khi gửi dữ liệu lên GitHub: " + (resJson.message || "Kiểm tra lại Token/Repo"));
        }
      } catch (err) {
        alert("Lỗi kết nối GitHub API: " + err.message);
      }
    }

    function toggleSelectAll(master) {
      students.forEach(s => s.selected = master.checked);
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("attendance-tbody");
      if (!students || students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Không tìm thấy danh sách học sinh. Vui lòng kiểm tra lại khung soi dữ liệu ở mục Cấu hình bên trên.</td></tr>`;
        return;
      }

      tbody.innerHTML = students.map((s, idx) => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-3"><input type="checkbox" ${s.selected ? 'checked' : ''} onchange="students[${idx}].selected = this.checked"></td>
          <td class="p-3 text-slate-400 font-medium">${idx + 1}</td>
          <td class="p-3 font-semibold text-slate-800">${s.name}</td>
          <td class="p-3"><span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">${s.lop}</span></td>
          <td class="p-3">
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${
              s.status === 'VẮNG CÓ PHÉP' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
            }">
              ${s.status}
            </span>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
