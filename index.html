<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh Siêu Tốc</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #333; }
    .controls { margin-bottom: 15px; display: flex; gap: 10px; }
    button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
    .status-approved { color: green; font-weight: bold; }
    .status-pending { color: orange; }
  </style>
</head>
<body>

<div class="container">
  <h2>Quản Lý Điểm Danh Học Sinh</h2>
  
  <div class="controls">
    <button onclick="loadAttendanceData(true)">🔄 Làm mới dữ liệu</button>
    <button onclick="handleBatchApprove('P')">✅ Duyệt Có Phép (P)</button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
        <th>Mã HS</th>
        <th>Họ và Tên</th>
        <th>Lớp</th>
        <th>Thời gian</th>
        <th>Trạng thái (Cột P)</th>
      </tr>
    </thead>
    <tbody id="attendanceBody">
      <tr><td colspan="6">Đang tải dữ liệu...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // THAY BẰNG URL WEB APP CỦA BẠN SAU KHI DEPLOY
  const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_EXEC_URL/exec";

  document.addEventListener("DOMContentLoaded", function() {
    loadAttendanceData(false);
  });

  // 1. TẢI DỮ LIỆU CỰC NHANH VỚI LOCALSTORAGE CACHE
  function loadAttendanceData(forceRefresh) {
    const cachedData = localStorage.getItem("local_attendance_data");

    // Hiển thị ngay từ LocalStorage trong < 0.05 giây
    if (cachedData && !forceRefresh) {
      renderTable(JSON.parse(cachedData));
    }

    // Chạy fetch ngầm để cập nhật dữ liệu mới nhất
    const fetchUrl = forceRefresh ? SCRIPT_URL + "?cachebust=" + Date.now() : SCRIPT_URL;

    fetch(fetchUrl)
      .then(res => res.json())
      .then(data => {
        localStorage.setItem("local_attendance_data", JSON.stringify(data));
        renderTable(data);
      })
      .catch(err => console.error("Lỗi đồng bộ dữ liệu:", err));
  }

  // 2. VẼ BẢNG GIAO DIỆN TỐI ƯU
  function renderTable(data) {
    const tbody = document.getElementById("attendanceBody");
    if (!data || data.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6'>Không có dữ liệu.</td></tr>";
      return;
    }

    let html = "";
    data.forEach(item => {
      const isApproved = item.colP === "P" || item.colP === "p";
      const statusClass = isApproved ? "status-approved" : "status-pending";
      
      html += `
        <tr id="row-${item.rowIndex}">
          <td><input type="checkbox" class="row-checkbox" value="${item.rowIndex}"></td>
          <td>${item.maHs}</td>
          <td>${item.name}</td>
          <td>${item.lop}</td>
          <td>${item.time}</td>
          <td id="status-${item.rowIndex}" class="${statusClass}">${item.colP || '---'}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  // 3. THAO TÁC DUYỆT TỨC THÌ (OPTIMISTIC UPDATE)
  function handleBatchApprove(statusValue) {
    const checkboxes = document.querySelectorAll(".row-checkbox:checked");
    const rowIndexes = Array.from(checkboxes).map(cb => parseInt(cb.value));

    if (rowIndexes.length === 0) {
      alert("Vui lòng chọn ít nhất một học sinh để duyệt!");
      return;
    }

    // A. ĐỔI TRẠNG THÁI TRÊN BẢNG TỨC THÌ (Không chờ server)
    rowIndexes.forEach(rIdx => {
      const statusCell = document.getElementById("status-" + rIdx);
      if (statusCell) {
        statusCell.innerText = statusValue;
        statusCell.className = "status-approved";
      }
    });

    // B. CẬP NHẬT CACHE CỤC BỘ TỨC THÌ
    const cachedData = localStorage.getItem("local_attendance_data");
    if (cachedData) {
      let list = JSON.parse(cachedData);
      list.forEach(item => {
        if (rowIndexes.includes(item.rowIndex)) {
          item.colP = statusValue;
        }
      });
      localStorage.setItem("local_attendance_data", JSON.stringify(list));
    }

    // C. GỬI YÊU CẦU POST NGẦM VỀ GOOGLE SHEETS
    const payload = {
      action: "approvePhep",
      rowIndexes: rowIndexes,
      statusValue: statusValue,
      sessionRole: "admin"
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Lỗi gửi dữ liệu ngầm:", err));
  }

  function toggleSelectAll(master) {
    const checkboxes = document.querySelectorAll(".row-checkbox");
    checkboxes.forEach(cb => cb.checked = master.checked);
  }
</script>

</body>
</html>
