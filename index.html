<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh & Phê Duyệt NGHỈ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #007bff;
      color: white;
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .user-info {
      font-size: 14px;
    }
    .action-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .btn-submit:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #e9ecef;
    }
    .text-left {
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Hệ Thống Quản Lý Điểm Danh - THPT Vị Thanh</h2>
    <div class="user-info">
      Người dùng: <strong id="lblUsername">admin</strong> (<span id="lblRole">Admin</span>)
    </div>
  </div>

  <div class="action-toolbar">
    <!-- Nút Ghi Nhận Ngày Nghỉ (Chỉ Admin mới thấy) -->
    <button id="btnGhiNhanNghi" class="btn-submit" style="display: none;" onclick="ghiNhanNgayNghi()">
      📝 Ghi nhận ngày nghỉ
    </button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
        <th>STT</th>
        <th>Mã Học Sinh</th>
        <th class="text-left">Họ và Tên</th>
        <th>Trạng Thái Xin Nghỉ</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      <!-- Dữ liệu mẫu tương ứng với dòng từ 5 trở đi bên sheet DATA -->
      <tr data-row="5">
        <td><input type="checkbox" class="chkStudent" value="5"></td>
        <td>1</td>
        <td>20234379</td>
        <td class="text-left">Nguyễn Văn A</td>
        <td>Có đơn xin nghỉ</td>
      </tr>
      <tr data-row="6">
        <td><input type="checkbox" class="chkStudent" value="6"></td>
        <td>2</td>
        <td>20234380</td>
        <td class="text-left">Trần Thị B</td>
        <td>Có đơn xin nghỉ</td>
      </tr>
      <tr data-row="7">
        <td><input type="checkbox" class="chkStudent" value="7"></td>
        <td>3</td>
        <td>20234381</td>
        <td class="text-left">Lê Văn C</td>
        <td>Có đơn xin nghỉ</td>
      </tr>
    </tbody>
  </table>

  <script>
    // 1. Cấu hình Tài khoản Người dùng & Quyền hạn (Thay đổi thực tế từ Login/Session)
    var currentUser = {
      username: "admin", // Tên đăng nhập
      role: "admin"      // Quyền: 'admin' hoặc 'user'
    };

    // 2. Link Web App từ Apps Script
    var WEB_APP_URL = "https://script.google.com/macros/s/MÃ_WEB_APP_CỦA_BẠN/exec";

    // 3. Khởi tạo khi tải trang
    document.addEventListener("DOMContentLoaded", function() {
      // Cập nhật thông tin giao diện
      document.getElementById("lblUsername").innerText = currentUser.username;
      document.getElementById("lblRole").innerText = currentUser.role === "admin" ? "Quản trị viên (Admin)" : "Giáo viên";

      // PHÂN QUYỀN: Chỉ hiển thị Nút "Ghi nhận ngày nghỉ" nếu là Admin
      if (currentUser && currentUser.role === "admin") {
        document.getElementById("btnGhiNhanNghi").style.display = "inline-block";
      }
    });

    // 4. Chọn/Bỏ chọn tất cả checkbox
    function toggleSelectAll(master) {
      var checkboxes = document.querySelectorAll('.chkStudent');
      checkboxes.forEach(function(chk) {
        chk.checked = master.checked;
      });
    }

    // 5. Hàm xử lý khi Admin bấm nút "Ghi nhận ngày nghỉ"
    function ghiNhanNgayNghi() {
      // Lấy danh sách dòng được tích chọn
      var selectedCheckboxes = document.querySelectorAll('.chkStudent:checked');
      var selectedRows = [];
      selectedCheckboxes.forEach(function(chk) {
        selectedRows.push(chk.value);
      });

      if (selectedRows.length === 0) {
        alert("Vui lòng chọn ít nhất một học sinh để ghi nhận ngày nghỉ!");
        return;
      }

      if (!confirm("Xác nhận duyệt và ghi nhận ngày nghỉ cho " + selectedRows.length + " học sinh đã chọn?")) {
        return;
      }

      var btn = document.getElementById("btnGhiNhanNghi");
      btn.disabled = true;
      btn.innerText = "⏳ Đang xử lý...";

      // Gửi tham số rows, col (cột data=17) và role (admin) sang Apps Script
      var requestUrl = WEB_APP_URL + "?rows=" + selectedRows.join(",") + "&col=17&role=" + currentUser.role;

      fetch(requestUrl)
        .then(function(response) {
          return response.text();
        })
        .then(function(data) {
          btn.disabled = false;
          btn.innerText = "📝 Ghi nhận ngày nghỉ";

          if (data.includes("SUCCESS")) {
            alert("Thành công: " + data);
            location.reload(); // Tải lại trang để cập nhật trạng thái mới
          } else if (data.includes("UNAUTHORIZED")) {
            alert("LỖI PHÂN QUYỀN: Bạn không có quyền Admin để thực hiện thao tác này!");
          } else {
            alert("Có lỗi xảy ra: " + data);
          }
        })
        .catch(function(error) {
          btn.disabled = false;
          btn.innerText = "📝 Ghi nhận ngày nghỉ";
          alert("Lỗi kết nối máy chủ: " + error);
        });
    }
  </script>
</body>
</html>
