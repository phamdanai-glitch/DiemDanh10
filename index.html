<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Điểm Danh Trực Tuyến - THPT Vị Thanh</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-5 md:p-6">

  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl p-4 sm:p-6 border border-slate-100 space-y-6">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-100">
      <div class="flex items-center gap-4">
        <div class="p-1.5 bg-white border border-slate-200 rounded-2xl shadow-sm flex-shrink-0">
          <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/100x100/4f46e5/ffffff?text=THPT+VT'" class="w-16 h-16 md:w-20 md:h-20 rounded-xl object-contain">
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-800 leading-tight">Quản Lý Điểm Danh Trực Tuyến</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-1">
            Trường THPT Vị Thanh • Tổng HS: <span id="total-students" class="font-bold text-indigo-600">0</span>
          </p>
          <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1.5">
            <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            Trạng thái: <span id="connection-status" class="font-semibold text-slate-600">Tự động đồng bộ</span>
          </p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5" id="action-buttons">
        <!-- Nút làm mới thủ công -->
        <button onclick="fetchDataFromSheet(true)" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 px-3.5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 transition-all cursor-pointer">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i> Làm Mới
        </button>

        <!-- Nút GVCN Duyệt Phép -->
        <button id="btn-approve" onclick="openApproveModal()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition-all cursor-pointer">
          <i data-lucide="shield-check" class="w-4 h-4"></i> GVCN Duyệt Có Phép
        </button>
      </div>
    </div>

    <!-- CÁC THẺ THỐNG KÊ -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
      <div class="bg-indigo-50/60 border border-indigo-100 p-3.5 rounded-xl">
        <p class="text-xs font-medium text-indigo-600">Đúng giờ</p>
        <p id="stat-dung-gio" class="text-xl font-bold text-indigo-900 mt-1">0</p>
      </div>
      <div class="bg-amber-50/60 border border-amber-100 p-3.5 rounded-xl">
        <p class="text-xs font-medium text-amber-600">Đi trễ</p>
        <p id="stat-di-tre" class="text-xl font-bold text-amber-900 mt-1">0</p>
      </div>
      <div class="bg-emerald-50/60 border border-emerald-100 p-3.5 rounded-xl">
        <p class="text-xs font-medium text-emerald-600">Vắng có phép</p>
        <p id="stat-phep" class="text-xl font-bold text-emerald-900 mt-1">0</p>
      </div>
      <div class="bg-slate-100/80 border border-slate-200 p-3.5 rounded-xl">
        <p class="text-xs font-medium text-slate-600">Không quét thẻ</p>
        <p id="stat-khong-quet" class="text-xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-rose-50/60 border border-rose-100 p-3.5 rounded-xl col-span-2 sm:col-span-1">
        <p class="text-xs font-medium text-rose-600">Không phép</p>
        <p id="stat-khong-phep" class="text-xl font-bold text-rose-900 mt-1">0</p>
      </div>
    </div>

    <!-- BỘ LỌC TÌM KIẾM -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="search-input" oninput="filterData()" placeholder="Nhập tên học sinh hoặc mã HS..." class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
      </div>
      
      <select id="class-filter" onchange="filterData()" class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
        <option value="">-- Tất cả các lớp --</option>
      </select>

      <select id="status-filter" onchange="filterData()" class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
        <option value="">-- Tất cả trạng thái --</option>
        <option value="ĐÚNG GIỜ">ĐÚNG GIỜ</option>
        <option value="ĐI TRỄ">ĐI TRỄ</option>
        <option value="PHÉP">PHÉP</option>
        <option value="KHÔNG QUÉT">KHÔNG QUÉT</option>
        <option value="KHÔNG PHÉP">KHÔNG PHÉP</option>
      </select>
    </div>

    <!-- BẢNG DỮ LIỆU -->
    <div class="overflow-x-auto rounded-xl border border-slate-200">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50/80 text-slate-600 font-semibold">
            <th class="p-3.5 w-10 text-center col-checkbox"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)" class="rounded text-indigo-600 cursor-pointer"></th>
            <th class="p-3.5 w-12 text-center">STT</th>
            <th class="p-3.5">Họ và Tên</th>
            <th class="p-3.5">Lớp</th>
            <th class="p-3.5">Mã HS</th>
            <th class="p-3.5">Thời Gian Quẹt</th>
            <th class="p-3.5">Trạng Thái</th>
          </tr>
        </thead>
        <tbody id="attendance-tbody" class="divide-y divide-slate-100">
          <tr>
            <td colspan="7" class="p-8 text-center text-slate-400">Đang tải dữ liệu...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // DÁN LINK EXEC CỦA GOOGLE APPS SCRIPT VÀO ĐÂY:
    const SCRIPT_URL = "THAY_LINK_WEB_APP_APPS_SCRIPT_CUA_BAN_VAO_DAY";

    let allStudents = [];
    let filteredStudents = [];
    let isParentMode = false;

    window.onload = function() {
      // Phân quyền Phụ huynh qua tham số URL (?mode=phuhuynh)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'phuhuynh') {
        isParentMode = true;
        document.getElementById('btn-approve').style.display = 'none';
        document.querySelectorAll('.col-checkbox').forEach(el => el.style.display = 'none');
      }

      // Tải dữ liệu ban đầu
      fetchDataFromSheet();

      // TỰ ĐỘNG CẬP NHẬT DỮ LIỆU NGẦM MỖI 15 GIÂY
      setInterval(() => {
        fetchDataFromSheet(false, true);
      }, 15000);
    };

    // 1. TẢI DỮ LIỆU SIÊU TỐC - TƯƠNG THÍCH HOÀN HẢO MOBILE
    function fetchDataFromSheet(isManualRefresh = false, isSilent = false) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon && !isSilent) refreshIcon.classList.add('animate-spin');

      // Đọc Cache hiển thị tức thì
      const cachedData = localStorage.getItem("vt_attendance_cache");
      if (cachedData && !isManualRefresh && allStudents.length === 0) {
        try {
          parseSheetData(JSON.parse(cachedData));
        } catch(e) {}
      } else if (!cachedData && allStudents.length === 0) {
        document.getElementById('attendance-tbody').innerHTML = 
          `<tr><td colspan="7" class="p-8 text-center text-slate-400">Đang đồng bộ dữ liệu mới nhất...</td></tr>`;
      }

      // Gọi API Google Sheets - Bổ sung redirect: "follow" cho Safari & Chrome Mobile
      fetch(SCRIPT_URL + "?action=getData", { 
        method: "GET",
        redirect: "follow"
      })
        .then(res => {
          if (!res.ok) throw new Error("HTTP Status " + res.status);
          return res.json();
        })
        .then(data => {
          if (refreshIcon) refreshIcon.classList.remove('animate-spin');
          if (Array.isArray(data)) {
            localStorage.setItem("vt_attendance_cache", JSON.stringify(data));
            parseSheetData(data);
          }
        })
        .catch(err => {
          if (refreshIcon) refreshIcon.classList.remove('animate-spin');
          console.error("Lỗi fetch mobile:", err);
          if (allStudents.length === 0) {
            document.getElementById('attendance-tbody').innerHTML = 
              `<tr><td colspan="7" class="p-8 text-center text-rose-500 font-semibold">Không thể tải dữ liệu trên điện thoại!<br><span class="text-xs text-slate-400">Hãy mở link bằng trình duyệt Safari/Chrome hoặc kiểm tra kết nối mạng.</span></td></tr>`;
          }
        });
    }

    // 2. PHÂN TÍCH DỮ LIỆU TỪ SHEET
    function parseSheetData(rows) {
      // Giữ trạng thái Checkbox của người dùng
      const selectedMap = new Map();
      allStudents.forEach(s => { if (s.selected) selectedMap.set(s.rowIndex, true); });

      allStudents = [];
      
      // Đọc từ Hàng 5 (Index 4)
      for (let i = 4; i < rows.length; i++) {
        let row = rows[i] || [];
        let hoTen = String(row[1] || "").trim(); // Cột B
        let maHs = String(row[4] || "").trim();  // Cột E

        if (hoTen !== "" || maHs !== "") {
          let statusObj = computeStatus(row);
          let rIndex = i + 1;

          allStudents.push({
            rowIndex: rIndex,
            name: hoTen,
            lop: String(row[2] || "---").trim().toUpperCase(), // Cột C
            maHs: maHs !== "" ? maHs : "---",
            time: row[10] ? String(row[10]).trim() : "---",     // Cột K
            status: statusObj.text,
            badgeClass: statusObj.badgeClass,
            selected: selectedMap.has(rIndex) ? true : false
          });
        }
      }

      document.getElementById("total-students").innerText = allStudents.length;

      // Cập nhật Danh sách Lớp
      const currentClassSelection = document.getElementById("class-filter").value;
      const classes = [...new Set(allStudents.map(s => s.lop))].filter(c => c !== "---").sort();
      document.getElementById("class-filter").innerHTML = `<option value="">-- Tất cả các lớp (${classes.length}) --</option>` + 
        classes.map(c => `<option value="${c}" ${c === currentClassSelection ? 'selected' : ''}>${c}</option>`).join('');

      updateStatsCounters();
      filterData();
    }

    // 3. LOGIC XÁC ĐỊNH TRẠNG THÁI (F, L, P)
    function computeStatus(row) {
      let colF = String(row[5] || "").trim().toLowerCase();   // Cột F: CÓ MẶT
      let colL = String(row[11] || "").trim();                // Cột L: VÔ TRĨ / ĐI TRỄ
      let colP = String(row[15] || "").trim().toLowerCase();   // Cột P: Trạng thái P/KQ

      // NHÁNH 1: HỌC SINH CÓ ĐI HỌC (Cột F = "x")
      if (colF === "x") {
        if (colL === "") {
          return {
            text: "ĐÚNG GIỜ",
            badgeClass: "bg-indigo-100 text-indigo-700 border-indigo-200"
          };
        } else {
          return {
            text: "ĐI TRỄ",
            badgeClass: "bg-amber-100 text-amber-800 border-amber-200"
          };
        }
      } 
      
      // NHÁNH 2: HỌC SINH KHÔNG ĐI HỌC (Cột F TRỐNG)
      else {
        // 1. Kiểm tra Cột P = "p" -> PHÉP
        if (colP === "p") {
          return {
            text: "PHÉP",
            badgeClass: "bg-emerald-100 text-emerald-700 border-emerald-200"
          };
        } 
        // 2. Kiểm tra Cột P = "kq" -> KHÔNG QUÉT
        else if (colP === "kq") {
          return {
            text: "KHÔNG QUÉT",
            badgeClass: "bg-slate-100 text-slate-600 border-slate-200"
          };
        } 
        // 3. Kiểm tra Cột P TRỐNG / RỖNG -> KHÔNG PHÉP
        else {
          return {
            text: "KHÔNG PHÉP",
            badgeClass: "bg-rose-100 text-rose-700 border-rose-200"
          };
        }
      }
    }

    // 4. CẬP NHẬT BỘ ĐẾM
    function updateStatsCounters() {
      document.getElementById("stat-dung-gio").innerText = allStudents.filter(s => s.status === "ĐÚNG GIỜ").length;
      document.getElementById("stat-di-tre").innerText = allStudents.filter(s => s.status === "ĐI TRỄ").length;
      document.getElementById("stat-phep").innerText = allStudents.filter(s => s.status === "PHÉP").length;
      document.getElementById("stat-khong-quet").innerText = allStudents.filter(s => s.status === "KHÔNG QUÉT").length;
      document.getElementById("stat-khong-phep").innerText = allStudents.filter(s => s.status === "KHÔNG PHÉP").length;
    }

    // 5. LỌC TÌM KIẾM
    function filterData() {
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const selectedClass = document.getElementById("class-filter").value;
      const selectedStatus = document.getElementById("status-filter").value;

      filteredStudents = allStudents.filter(s => {
        const matchSearch = !search || s.name.toLowerCase().includes(search) || s.maHs.toLowerCase().includes(search);
        const matchClass = !selectedClass || s.lop === selectedClass;
        const matchStatus = !selectedStatus || s.status === selectedStatus;
        return matchSearch && matchClass && matchStatus;
      });

      renderTable();
    }

    function toggleSelectAll(master) {
      filteredStudents.forEach(s => s.selected = master.checked);
      renderTable();
    }

    // 6. RENDER BẢNG
    function renderTable() {
      const tbody = document.getElementById("attendance-tbody");
      if (filteredStudents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">Không tìm thấy dữ liệu học sinh phù hợp.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredStudents.map((s, idx) => {
        return `
          <tr class="hover:bg-slate-50/80 ${s.selected ? 'bg-indigo-50/30' : ''}">
            ${!isParentMode ? `<td class="p-3.5 text-center col-checkbox"><input type="checkbox" ${s.selected ? 'checked' : ''} onchange="filteredStudents[${idx}].selected = this.checked" class="rounded text-indigo-600 cursor-pointer"></td>` : ''}
            <td class="p-3.5 text-center text-slate-400 font-medium">${idx + 1}</td>
            <td class="p-3.5 font-semibold text-slate-800">${s.name}</td>
            <td class="p-3.5"><span class="px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-600 rounded-lg text-xs font-bold">${s.lop}</span></td>
            <td class="p-3.5 text-slate-500 font-mono text-xs">${s.maHs}</td>
            <td class="p-3.5 text-slate-500 font-mono text-xs">${s.time}</td>
            <td class="p-3.5"><span class="px-2.5 py-1 rounded-lg text-xs font-bold border inline-block ${s.badgeClass}">${s.status}</span></td>
          </tr>
        `;
      }).join('');

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    // 7. DUYỆT PHÉP
    function openApproveModal() {
      const selected = filteredStudents.filter(s => s.selected);
      if (selected.length === 0) {
        alert("Vui lòng tích chọn ít nhất 1 học sinh trong danh sách để duyệt có phép!");
        return;
      }

      const password = prompt(`Xác nhận duyệt CÓ PHÉP cho ${selected.length} học sinh được chọn.\nNhập mật khẩu GVCN:`);
      if (!password) return;

      const payload = {
        action: "approvePhep",
        password: password,
        rowIndexes: selected.map(s => s.rowIndex)
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        redirect: "follow"
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert(res.message);
          fetchDataFromSheet(true);
        } else {
          alert("Lỗi: " + res.message);
        }
      })
      .catch(err => alert("Không thể kết nối máy chủ: " + err.message));
    }
  </script>
</body>
</html>
