<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh Trực Tuyến - THPT Vị Thanh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased pb-12">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-lg border-b border-indigo-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-xl shadow-inner">
          <i class="fa-solid me-0 fa-id-card text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide">THPT VỊ THANH</h1>
          <p class="text-xs text-indigo-200">Hệ Thống Điểm Danh & Duyệt Phép Trực Tuyến</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnLoginModal" onclick="openLoginModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1.5 border border-indigo-400/30">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
        </button>

        <div id="userInfo" class="hidden flex items-center gap-2 bg-indigo-800/80 px-3 py-1 rounded-lg border border-indigo-600/50">
          <span id="userBadge" class="text-xs font-bold text-amber-300"></span>
          <button onclick="handleLogout()" class="text-xs text-indigo-200 hover:text-white ml-2 transition">
            <i class="fa-solid fa-power-off"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 mt-4">

    <!-- Trạng thái kết nối & Cập nhật Cache -->
    <div id="connectionStatus" class="flex items-center gap-2 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200/80 px-3 py-1.5 rounded-lg w-fit shadow-sm my-2">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span id="statusText">Đã kết nối dữ liệu mới nhất</span>
    </div>

    <!-- Thanh công cụ điều khiển -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap items-center gap-2 flex-1 min-w-[280px]">
        <div class="relative flex-1 max-w-xs">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" oninput="filterData()" placeholder="Tìm tên, lớp, mã HS..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <select id="filterClass" onchange="filterData()" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="">Tất cả Lớp</option>
        </select>

        <select id="filterStatus" onchange="filterData()" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="">Tất cả Trạng thái</option>
          <option value="ĐÚNG GIỜ">Đúng giờ</option>
          <option value="ĐỊ TRỄ">Đi trễ</option>
          <option value="PHÉP">Nghỉ Phép</option>
          <option value="KHÔNG PHÉP">Không Phép</option>
          <option value="KHÔNG QUÉT">Không quét</option>
        </select>
      </div>

      <!-- Action Buttons cho GVCN / ADMIN -->
      <div id="actionGroup" class="hidden flex items-center gap-2">
        <button onclick="approveSelected('P')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1">
          <i class="fa-solid fa-check"></i> Duyệt Phép (P)
        </button>
        <button onclick="approveSelected('KP')" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1">
          <i class="fa-solid fa-xmark"></i> Không Phép (KP)
        </button>
        <button id="btnExport" onclick="exportHistory()" class="hidden px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1">
          <i class="fa-solid fa-file-export"></i> Rút Lịch Sử
        </button>
      </div>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
            <tr>
              <th id="thSelectAll" class="p-3 text-center hidden w-10">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" class="rounded text-indigo-600 cursor-pointer">
              </th>
              <th class="p-3 text-center w-12">STT</th>
              <th class="p-3">Họ và Tên</th>
              <th class="p-3">Lớp</th>
              <th class="p-3">Mã HS</th>
              <th class="p-3">Thời gian quẹt</th>
              <th class="p-3">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-indigo-500"></i>
                <p>Đang tải dữ liệu điểm danh...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Đăng nhập -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-sm p-6 relative">
      <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-lock text-indigo-600"></i> Đăng Nhập Hệ Thống
      </h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-bold text-slate-500 uppercase">Tài khoản (Tên Lớp / ADMIN)</label>
          <input type="text" id="loginUser" placeholder="Ví dụ: 12A1 hoặc ADMIN" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg mt-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="text-[11px] font-bold text-slate-500 uppercase">Mật khẩu</label>
          <input type="password" id="loginPass" placeholder="Mật khẩu mặc định: 123456" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg mt-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <div class="mt-5 flex gap-2 justify-end">
        <button onclick="closeLoginModal()" class="px-3 py-1.5 text-xs text-slate-500 font-semibold hover:bg-slate-100 rounded-lg">Hủy</button>
        <button onclick="executeLogin()" class="px-4 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow">Đăng nhập</button>
      </div>
    </div>
  </div>

  <script>
    // Cấu hình URL Apps Script Deployment
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxG19aC6S9uF9IvdL9xQ9iA9qR8hP7e4e1t0uY/exec"; // Thay URL mới của thầy/cô vào đây

    let globalData = [];
    let filteredData = [];
    let currentUser = null; // { role: 'gvcn'|'admin', className: '12A1' }

    document.addEventListener("DOMContentLoaded", () => {
      fetchData();
    });

    // Lấy dữ liệu Điểm danh
    function fetchData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(response => {
          let rawList = [];
          let lastUpdatedTime = "";

          if (Array.isArray(response)) {
            rawList = response;
            lastUpdatedTime = new Date().toLocaleTimeString("vi-VN");
          } else if (response && response.data) {
            rawList = response.data;
            lastUpdatedTime = response.lastUpdated || new Date().toLocaleTimeString("vi-VN");
          }

          // Cập nhật trạng thái
          const statusTextEl = document.getElementById("statusText");
          if (statusTextEl) {
            statusTextEl.innerHTML = `Đã kết nối dữ liệu mới nhất <span class="font-bold text-emerald-800">(Cập nhật lúc: ${lastUpdatedTime})</span>`;
          }

          globalData = rawList.map(item => ({
            ...item,
            selected: false,
            computedStatus: computeStatus(item)
          }));

          populateClassFilter();
          filterData();
        })
        .catch(err => {
          document.getElementById("statusText").innerText = "Mất kết nối dữ liệu! Đang kết nối lại...";
        });
    }

    // Tính toán hiển thị trạng thái
    function computeStatus(item) {
      let p = String(item.colP || "").trim().toUpperCase();
      let q = String(item.colQ || "").trim().toUpperCase();

      if (p === "P" || p === "PHÉP" || q === "P" || q === "PHÉP") return { text: "PHÉP", badge: "bg-amber-100 text-amber-700 border-amber-300" };
      if (p === "KP" || p === "KHÔNG PHÉP" || q === "KP" || q === "KHÔNG PHÉP") return { text: "KHÔNG PHÉP", badge: "bg-rose-100 text-rose-700 border-rose-300" };
      
      if (item.time && item.time !== "---") {
        if (q === "ĐỊ TRỄ" || q === "TRỄ") return { text: "ĐỊ TRỄ", badge: "bg-orange-100 text-orange-700 border-orange-300" };
        return { text: "ĐÚNG GIỜ", badge: "bg-emerald-100 text-emerald-700 border-emerald-300" };
      }
      return { text: "KHÔNG QUÉT", badge: "bg-slate-100 text-slate-500 border-slate-300" };
    }

    // Đổ danh sách Lớp vào Dropdown
    function populateClassFilter() {
      const select = document.getElementById("filterClass");
      const currentVal = select.value;
      const classes = [...new Set(globalData.map(d => d.lop))].filter(Boolean).sort();
      
      select.innerHTML = '<option value="">Tất cả Lớp</option>';
      classes.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
      });
      select.value = currentVal;
    }

    // Lọc dữ liệu
    function filterData() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const cls = document.getElementById("filterClass").value;
      const st = document.getElementById("filterStatus").value;

      filteredData = globalData.filter(d => {
        const matchSearch = d.name.toLowerCase().includes(search) || d.lop.toLowerCase().includes(search) || d.maHs.toLowerCase().includes(search);
        const matchClass = !cls || d.lop === cls;
        const matchUserClass = !currentUser || currentUser.role === 'admin' || d.lop === currentUser.className;
        const matchStatus = !st || d.computedStatus.text === st;

        return matchSearch && matchClass && matchUserClass && matchStatus;
      });

      renderTable();
    }

    // Render Bảng Dữ liệu
    function renderTable() {
      const tbody = document.getElementById("tableBody");
      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Không tìm thấy dữ liệu phù hợp</td></tr>`;
        return;
      }

      let html = "";
      filteredData.forEach((s, idx) => {
        let timeDisplay = (s.time && s.time !== "undefined" && s.time !== "null") ? s.time : "---";

        html += `
          <tr class="hover:bg-slate-50/80 transition ${s.selected ? 'bg-indigo-50/40' : ''}">
            ${currentUser ? `<td class="p-3 text-center"><input type="checkbox" ${s.selected ? 'checked' : ''} onchange="toggleRowSelect(${idx}, this)" class="rounded text-indigo-600 cursor-pointer"></td>` : ''}
            <td class="p-3 text-center text-slate-400 font-medium">${idx + 1}</td>
            <td class="p-3 font-semibold text-slate-800">${s.name}</td>
            <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-md text-[11px] font-bold">${s.lop}</span></td>
            <td class="p-3 text-slate-500 font-mono text-xs">${s.maHs}</td>
            <td class="p-3 text-slate-500 font-mono text-xs">${timeDisplay}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[11px] font-bold border inline-block ${s.computedStatus.badge}">${s.computedStatus.text}</span></td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // Modal & Auth Logic
    function openLoginModal() { document.getElementById("loginModal").classList.remove("hidden"); }
    function closeLoginModal() { document.getElementById("loginModal").classList.add("hidden"); }

    function executeLogin() {
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username: u, password: p })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser = { role: res.role, className: res.className };
          document.getElementById("btnLoginModal").classList.add("hidden");
          document.getElementById("userInfo").classList.remove("hidden");
          document.getElementById("userBadge").innerText = res.role === 'admin' ? "ADMIN" : `GVCN ${res.className}`;
          
          document.getElementById("thSelectAll").classList.remove("hidden");
          document.getElementById("actionGroup").classList.remove("hidden");
          if (res.role === 'admin') document.getElementById("btnExport").classList.remove("hidden");

          closeLoginModal();
          filterData();
        } else {
          alert(res.message);
        }
      });
    }

    function handleLogout() {
      currentUser = null;
      location.reload();
    }

    function toggleRowSelect(idx, cb) {
      filteredData[idx].selected = cb.checked;
      renderTable();
    }

    function toggleSelectAll(cb) {
      filteredData.forEach(d => d.selected = cb.checked);
      renderTable();
    }

    // Duyệt phép
    function approveSelected(statusVal) {
      const selectedRows = filteredData.filter(d => d.selected).map(d => d.rowIndex);
      if (selectedRows.length === 0) return alert("Vui lòng chọn ít nhất 1 học sinh!");

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "approvePhep", rowIndexes: selectedRows, statusValue: statusVal })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.success) fetchData();
      });
    }

    // Rút Lịch Sử
    function exportHistory() {
      const pass = prompt("Nhập mật khẩu ADMIN để rút lịch sử:");
      if (!pass) return;

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "exportHistory", adminPassword: pass })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.success) fetchData();
      });
    }
  </script>
</body>
</html>
